one_wire:
  - id: one_wire1_id
    platform: gpio
    pin: 4

dallas_temp_searcher:
  - id: dallas_searcher_all
    one_wire_id: one_wire1_id
    update_interval: 20s
    mode: all
    name_prefix: "Temperature"
    name_addr_start_byte: 2
    name_addr_stop_byte: 6
    groups:
      - group1_id
      - group2_id
  
  - id: dallas_searcher_address_map
    one_wire_id: one_wire1_id
    update_interval: 30s
    mode: address_map
    max_sensors_num: 8
    name_prefix: "Mapped Sensor"
    groups:
      - group1_id

groups:
  - id: group1_id
    name: "Temperature Group 1"
  - id: group2_id
    name: "Temperature Group 2"