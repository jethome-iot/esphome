---
# NOTE: This file may need to be re-added after syncing with upstream ESPHome
# as upstream does not have this workflow.
name: Notify Parent Repository

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [dev-jethub]

jobs:
  notify:
    uses: jethome-iot/esphome-workspace/.github/workflows/notify-parent.yml@dev
    with:
      submodule: esphome
    secrets:
      parent_repo_token: ${{ secrets.PARENT_REPO_TOKEN }}
